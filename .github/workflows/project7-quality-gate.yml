name: Project 7 Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project7-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate acceptance-corrected integrated baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_p5_05.txt

      - name: Install quality-gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_p5_05.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5,<3"

      - name: Run Project 7 acceptance-corrected quality gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/ci
          {
            python -m compileall -q src tests scripts
            python scripts/ci_repository_checks.py
            python tests/validate_shared_schemas.py
            python tests/validate_component_contracts.py
            python tests/validate_safeguards.py
            python tests/validate_operational_workload.py
            python tests/validate_scenario_taxonomy.py
            python scripts/verify_p5_01_frozen_evaluation.py
            python scripts/verify_p5_02_metrics.py
            python scripts/verify_p5_03_failure_analysis.py
            python scripts/verify_p5_04_refinement.py
            python scripts/verify_p5_04_portability.py
            python scripts/verify_p5_05_final_baseline.py
            python scripts/verify_p5_06_acceptance_corrected_baseline.py
            python scripts/validate_operator_interface.py
            python scripts/verify_p5_12_operator_hardening.py
            python scripts/verify_p6_03_governance.py
            python scripts/verify_p6_04_reproducibility.py
            python scripts/verify_p5_12_final_submission_candidate.py
            python -m unittest \
              tests.test_refined_evaluation \
              tests.test_configuration_portability \
              tests.test_ci_workflow \
              tests.test_final_evaluation_freeze \
              tests.test_acceptance_corrected_baseline \
              tests.test_decision_support_packet \
              tests.test_pipeline_audit_path_overrides \
              tests.test_human_disposition_recorder \
              tests.test_operator_workflow \
              tests.test_p5_12_operator_hardening \
              tests.test_p6_03_governance \
              tests.test_p6_04_reproducibility \
              tests.test_p5_12_final_submission_candidate -v
          } 2>&1 | tee outputs/ci/project7-quality-gate.log

      - name: Generate hosted run metadata
        if: always()
        run: python scripts/generate_ci_run_metadata.py

      - name: Upload final quality-gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project7-acceptance-corrected-quality-gate-${{ github.run_number }}
          path: |
            outputs/ci/project7-quality-gate.log
            outputs/ci/hosted-run-metadata.json
            outputs/evaluation/p5_04/
            outputs/evaluation/p5_05/
            outputs/evaluation/p5_06/
            outputs/evaluation/p5_12/
            outputs/evaluation/p6_03/
            outputs/evaluation/p6_04/
            docs/P5_04_*.md
            docs/P5_04_*Validation*.json
            docs/P5_05_*.md
            docs/P5_05_*Validation*.json
            docs/P5_06_*.md
            docs/P5_06_*Validation*.json
            docs/P5_09_*.md
            docs/P5_09_*Manifest*.json
            docs/P5_12_*.md
            docs/P6_03_*
            docs/P6_04_*
            notebooks/Project_7_Operator_Interface.ipynb
          if-no-files-found: error
          retention-days: 30
